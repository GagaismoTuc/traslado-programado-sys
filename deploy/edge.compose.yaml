services:
  edge:
    image: caddy:2-alpine
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    environment:
      PRODUCTION_HOST: ${PRODUCTION_HOST:?required}
      STAGING_HOST: ${STAGING_HOST:?required}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - production
      - staging
networks:
  production:
    name: ${INGRESS_PREFIX:-traslado-ingress}-production
    ipam:
      config:
        - subnet: 172.16.10.0/24
  staging:
    name: ${INGRESS_PREFIX:-traslado-ingress}-staging
    ipam:
      config:
        - subnet: 172.16.20.0/24
volumes:
  caddy_data:
  caddy_config:
