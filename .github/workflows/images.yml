name: Container images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [api, office, driver]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          IMAGE: ghcr.io/gagaismotuc/traslado-${{ matrix.target }}:${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: docker build --target "$TARGET" --tag "$IMAGE" .
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, office, driver]
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/gagaismotuc/traslado-${{ matrix.target }}:${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          docker build --target "$TARGET" --tag "$IMAGE" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
