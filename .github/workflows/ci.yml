name: CI

on:
  pull_request:
  push:
    branches: [main, Gagaismo/traslado-programado-sys-101] # DIAGNOSTIC (#101): removed before the PR

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # DIAGNOSTIC (#101): runner specs, host load and per-test profile. Removed before the PR.
      - run: nproc && lscpu | head -20 && free -m
      - run: |
          vmstat -t 5 > "$RUNNER_TEMP/vmstat.log" &
          pnpm build && pnpm test
        env:
          TEST_PROFILE: ${{ runner.temp }}/profile.jsonl
      - if: always()
        run: node .github/scripts/profile-report.mjs "$RUNNER_TEMP/profile.jsonl"; cat "$RUNNER_TEMP/vmstat.log"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @traslado/office exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/office/test-results
          retention-days: 7

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh .github/scripts/test-ci-scripts.sh
      # On a push to main both SHAs are empty and there is nothing to lint.
      - run: sh .github/scripts/lint-commits.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh .github/scripts/gitleaks.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ci-ok:
    if: always()
    needs: [verify, e2e, commitlint, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One argument per job result, so $RESULTS is split on purpose.
      - run: |
          # shellcheck disable=SC2086
          sh .github/scripts/ci-ok.sh $RESULTS
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
