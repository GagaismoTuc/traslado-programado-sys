name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build && pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @traslado/office exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/office/test-results
          retention-days: 7

  deploy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker run --rm -v "$PWD:/work" -w /work docker:cli sh deploy/tests/test-deploy.sh
      - run: docker run --rm -v "$PWD:/work" -w /work docker:cli sh deploy/tests/test-seed.sh
      - run: node --test deploy/tests/compose.test.mjs
      - run: sh .github/scripts/test-deploy-images.sh

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh .github/scripts/test-ci-scripts.sh
      # On a push to main both SHAs are empty and there is nothing to lint.
      - run: sh .github/scripts/lint-commits.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh .github/scripts/gitleaks.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ci-ok:
    if: always()
    needs: [verify, e2e, deploy-tests, commitlint, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One argument per job result, so $RESULTS is split on purpose.
      - run: |
          # shellcheck disable=SC2086
          sh .github/scripts/ci-ok.sh $RESULTS
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
